<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work History subpage - identity explorer (4 variants)</title>
<!--
  PROTOTYPE - throwaway, not shipped.
  Question: the Work History subpage needs a unique, tasteful identity, the way
  Travel owns the globe + boarding-pass look. Four structurally different takes,
  switchable via ?variant= (a|b|c|d), the floating bottom bar, or arrow keys:
    A - Brass nameplates: extends the locked career "nameplate" inner identity.
        A wall of engraved plates; patina grows with age.
    B - Strata: a geological cross-section. Deeper = older. Band height scales
        with tenure; tech chips are embedded minerals. Echoes the site's dig motif.
    C - The Ascent: a switchback trail up a ridgeline (echoes the home scene).
        Valley = 2005, summit = now. Cards hang off waypoints along the path.
    D - Personnel dossier: manila folder, typed records, ink stamps, paper clip.
  Same real data in all four (mirrored by hand from src/data/career.ts).
  Self-contained, no network. Open the file directly in a browser.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #e5e7eb;
    background:
      radial-gradient(1100px 600px at 75% -10%, #1d2233 0%, transparent 60%),
      linear-gradient(180deg, #0f172a 0%, #111827 60%, #0b1220 100%);
    min-height: 100vh;
  }
  header.page { max-width: 900px; margin: 0 auto; padding: 26px 20px 4px; }
  header.page h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: 0.01em; }
  header.page p { font-size: 13px; color: #94a3b8; margin: 0; line-height: 1.5; }

  /* fake subpage column so each variant is judged in panel-like context */
  .panel {
    max-width: 900px; margin: 18px auto 110px; padding: 0;
    border: 1px solid rgba(148,163,184,0.16); border-radius: 14px;
    background: rgba(2,6,23,0.55); backdrop-filter: blur(6px);
    overflow: hidden;
  }

  /* ============ floating switcher ============ */
  .switcher {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    background: #0b1220; border: 1px solid #334155; border-radius: 999px;
    padding: 8px 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    z-index: 50; font-size: 13px;
  }
  .switcher button {
    background: #1e293b; color: #e2e8f0; border: 1px solid #475569;
    border-radius: 999px; width: 30px; height: 30px; cursor: pointer;
    font-size: 14px; line-height: 1;
  }
  .switcher button:hover { background: #334155; }
  .switcher .label { min-width: 260px; text-align: center; color: #cbd5e1; }
  .switcher .label b { color: #f8fafc; }

  /* ============ Variant A - brass nameplates ============ */
  .vA { padding: 46px 28px 60px; background:
    linear-gradient(180deg, #14161c 0%, #101217 100%); }
  .vA .head { text-align: center; margin-bottom: 40px; }
  .vA .head h2 {
    margin: 0 0 6px; font-size: 15px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #cbb37a; font-weight: 600;
  }
  .vA .head p { margin: 0; font-size: 12.5px; color: #6b7280; letter-spacing: 0.08em; }
  .vA .wall { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
  .vA .plate {
    position: relative;
    border-radius: 6px;
    padding: 18px 26px 16px;
    background:
      linear-gradient(160deg, rgba(255,255,255,0.16) 0%, transparent 32%),
      linear-gradient(180deg, var(--hi) 0%, var(--lo) 100%);
    border: 1px solid rgba(0,0,0,0.55);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.28),
      inset 0 -2px 4px rgba(0,0,0,0.35),
      0 8px 22px rgba(0,0,0,0.5);
    color: var(--ink);
  }
  .vA .plate .year {
    position: absolute; top: -11px; left: 22px;
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    background: #0b0d12; color: #a8946a; padding: 3px 10px;
    border: 1px solid #3a3325; border-radius: 3px;
  }
  .vA .plate .role {
    font-size: 21px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase;
    text-shadow: 0 1px 0 rgba(255,255,255,0.25), 0 -1px 1px rgba(0,0,0,0.45);
  }
  .vA .plate .co {
    font-size: 11.5px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.72;
    margin-top: 3px;
    text-shadow: 0 1px 0 rgba(255,255,255,0.2);
  }
  .vA .under { max-width: 540px; margin: 10px auto 0; padding: 0 6px; }
  .vA .under p { margin: 0 0 6px; font-size: 13px; line-height: 1.6; color: #9aa3b2; }
  .vA .under p.story { color: #7d8697; font-style: italic; }
  .vA .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .vA .tags span {
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #8f8468; border: 1px solid #3a3529; border-radius: 3px; padding: 2px 8px;
  }

  /* ============ Variant B - strata ============ */
  .vB { background: linear-gradient(180deg, #0e1a2b 0%, #0c1523 100%); }
  .vB .sky { padding: 44px 28px 0; text-align: left; max-width: 760px; margin: 0 auto; }
  .vB .sky h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; color: #dbe7f5; letter-spacing: -0.01em; }
  .vB .sky p { margin: 0 0 18px; font-size: 13px; color: #7e93ad; }
  .vB svg.surface { display: block; width: 100%; height: 46px; }
  .vB .column { position: relative; }
  .vB .band { position: relative; padding: 22px 28px 24px; }
  .vB .band .inner { max-width: 700px; margin: 0 auto; display: grid; grid-template-columns: 86px 1fr; gap: 18px; }
  .vB .depth {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px; letter-spacing: 0.06em; text-align: right;
    padding-top: 3px; border-right: 1px dashed rgba(0,0,0,0.28);
    padding-right: 14px;
  }
  .vB .band .role { font-size: 17px; font-weight: 800; letter-spacing: 0.02em; }
  .vB .band .co { font-size: 12px; opacity: 0.75; margin-top: 1px; }
  .vB .band .desc { font-size: 13px; line-height: 1.55; margin-top: 7px; opacity: 0.92; }
  .vB .band .story { font-size: 12.5px; line-height: 1.55; margin-top: 6px; opacity: 0.7; font-style: italic; }
  .vB .minerals { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
  .vB .minerals span {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700;
    padding: 3px 9px 3px 20px; position: relative;
    background: rgba(0,0,0,0.16); border-radius: 2px 8px 2px 8px;
  }
  .vB .minerals span::before {
    content: ""; position: absolute; left: 7px; top: 50%; transform: translateY(-50%) rotate(45deg);
    width: 7px; height: 7px; background: currentColor; opacity: 0.55;
    clip-path: polygon(50% 0, 100% 38%, 78% 100%, 22% 100%, 0 38%);
  }
  .vB svg.seam { display: block; width: 100%; height: 18px; margin: 0; }
  .vB .bedrock {
    padding: 26px 28px 40px; text-align: center;
    font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: #3d4c5e;
    background: #0a0f16;
  }

  /* ============ Variant C - the ascent ============ */
  .vC { padding: 44px 24px 60px; background:
    radial-gradient(900px 400px at 50% 0%, #1b2a3f 0%, transparent 70%),
    linear-gradient(180deg, #101c2e 0%, #0c1420 100%); }
  .vC .head { text-align: center; margin-bottom: 8px; }
  .vC .head h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; color: #e3ecf7; }
  .vC .head p { margin: 0; font-size: 13px; color: #7e93ad; }
  .vC .trailwrap { position: relative; max-width: 780px; margin: 0 auto; }
  .vC svg.trail { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .vC .stops { position: relative; display: flex; flex-direction: column; }
  .vC .stop { display: flex; padding: 26px 0; }
  .vC .stop .card {
    width: 46%; background: rgba(15,26,42,0.85); border: 1px solid rgba(125,160,200,0.22);
    border-radius: 10px; padding: 15px 17px 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .vC .stop.left { justify-content: flex-start; }
  .vC .stop.right { justify-content: flex-end; }
  .vC .alt {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10.5px; letter-spacing: 0.14em; color: #6fa8dc; margin-bottom: 5px;
    display: flex; align-items: center; gap: 7px;
  }
  .vC .alt .flag { width: 9px; height: 9px; background: #e2b04a; clip-path: polygon(0 0, 100% 30%, 0 60%); }
  .vC .role { font-size: 16px; font-weight: 800; color: #eef4fb; }
  .vC .co { font-size: 12px; color: #93a9c2; margin-top: 1px; }
  .vC .desc { font-size: 12.5px; line-height: 1.55; color: #b8c7da; margin-top: 7px; }
  .vC .story { font-size: 12px; line-height: 1.5; color: #7f92a9; font-style: italic; margin-top: 5px; }
  .vC .gear { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .vC .gear span {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: #9db4cf;
    border: 1px solid rgba(125,160,200,0.3); border-radius: 999px; padding: 2px 9px;
  }
  .vC .summit, .vC .valley {
    text-align: center; font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
    color: #56708f; padding: 10px 0;
  }
  .vC .summit b { color: #e2b04a; letter-spacing: 0.3em; }

  /* ============ Variant D - personnel dossier ============ */
  .vD { padding: 50px 26px 64px; background:
    linear-gradient(180deg, #17130e 0%, #120f0b 100%); }
  .vD .folder {
    max-width: 660px; margin: 0 auto; position: relative;
    background: #c9a86b;
    border-radius: 6px 14px 6px 6px;
    padding: 26px 26px 30px;
    box-shadow: 0 18px 44px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .vD .folder::before {
    content: ""; position: absolute; top: -14px; left: 34px; width: 150px; height: 15px;
    background: #c9a86b; border-radius: 8px 8px 0 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .vD .tab {
    position: absolute; top: -11px; left: 48px; font-size: 10px; letter-spacing: 0.22em;
    text-transform: uppercase; color: #4b3a1f; font-weight: 700;
  }
  .vD .clip {
    position: absolute; top: -22px; right: 52px; width: 22px; height: 54px;
    border: 3px solid #8a8f98; border-radius: 11px 11px 4px 4px;
    border-bottom: none; z-index: 3;
  }
  .vD .sheet {
    position: relative; background: #f4ecd9; color: #2a251c;
    padding: 30px 30px 34px; border-radius: 2px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.3);
    font-family: ui-monospace, SFMono-Regular, "Courier New", Menlo, monospace;
  }
  .vD .sheet::before {
    content: ""; position: absolute; inset: 10px; border: 1px solid rgba(42,37,28,0.14);
    pointer-events: none;
  }
  .vD .sheath { font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase; color: #7a6f57; }
  .vD h2 { margin: 4px 0 2px; font-size: 21px; letter-spacing: 0.1em; text-transform: uppercase; }
  .vD .subject { font-size: 11px; color: #5d5541; margin-bottom: 22px; }
  .vD .stamp {
    position: absolute; top: 26px; right: 26px; transform: rotate(-9deg);
    font-size: 12px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase;
    color: #b3382e; border: 2.5px solid #b3382e; border-radius: 4px; padding: 4px 10px;
    opacity: 0.75; mix-blend-mode: multiply;
  }
  .vD .rec { border-top: 1px dashed rgba(42,37,28,0.35); padding: 16px 2px 14px; position: relative; }
  .vD .rec .line1 { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .vD .rec .role { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .vD .rec .year { font-size: 11px; color: #6d6450; white-space: nowrap; }
  .vD .rec .co { font-size: 11.5px; color: #5d5541; margin-top: 2px; }
  .vD .rec .desc { font-size: 12px; line-height: 1.65; margin-top: 8px; }
  .vD .rec .story { font-size: 11.5px; line-height: 1.6; margin-top: 6px; color: #6d6450; }
  .vD .rec .story::before { content: "NOTE: "; color: #b3382e; font-weight: 700; }
  .vD .inkrow { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .vD .inkrow span {
    font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 700;
    color: #3f568c; border: 1.5px solid #3f568c; border-radius: 3px; padding: 2px 7px;
    opacity: 0.8; transform: rotate(-1.2deg); mix-blend-mode: multiply;
  }
  .vD .inkrow span:nth-child(2n) { transform: rotate(0.8deg); color: #6d6450; border-color: #6d6450; }
  .vD .eof { text-align: center; font-size: 10px; letter-spacing: 0.3em; color: #9a8f74; margin-top: 20px; }
</style>
</head>
<body>
<header class="page">
  <h1>Work History subpage - identity explorer</h1>
  <p>Four structurally different identities for the Work History subpage. Real data from <code>src/data/career.ts</code>. Switch with the bar below or the arrow keys.</p>
</header>

<div class="panel"><div id="stage"></div></div>

<div class="switcher">
  <button id="prev" aria-label="previous variant">←</button>
  <div class="label" id="label"></div>
  <button id="next" aria-label="next variant">→</button>
</div>

<script>
// Mirrored by hand from src/data/career.ts (CAREER_TIMELINE).
const JOBS = [
  { year: "Since 2021", start: 2021, end: 2026, role: "Lead Engineer", company: "Genius Sports - London, UK (Remote from DE)", desc: "Dynamic Sports Videos for Programmatic & Social.", stack: ["Python", "TypeScript", "AWS", "Kubernetes"], story: "Technical leadership across data orchestration, live video rendering and internal tooling. People management focused on personal growth, team building and more satisfaction at work." },
  { year: "2021", start: 2021, end: 2021, role: "Lead Frontend Engineer", company: "Spirable - London, UK (Remote from DE)", desc: "Dynamic Ads for Social Media.", stack: ["TypeScript", "React", "Vue.JS", "Material UI"] },
  { year: "2019 - 2021", start: 2019, end: 2021, role: "Lead Frontend Engineer", company: "enercast - Kassel, Germany", desc: "Wind/Solar Energy Forecasts.", stack: ["TypeScript", "React", "Redux", "Highcharts"] },
  { year: "2013 - 2019", start: 2013, end: 2019, role: "Frontend Engineer", company: "Cisco Systems - Kassel, Germany", desc: "Business SPA for Asset Management.", stack: ["Angular", "Vue.js", "GraphQL", "Highcharts", "D3"], story: "Owning a complex frontend app that manages an arbitrary number of business assets." },
  { year: "2012 - 2013", start: 2012, end: 2013, role: "Frontend Engineer", company: "Joulex - Kassel, Germany", desc: "Energy Management Web Application.", stack: ["Qooxdoo", "Play", "PostgreSQL"] },
  { year: "2007 - 2012", start: 2007, end: 2012, role: "Founder", company: "Acama Systems", desc: "Web agency building custom solutions.", stack: ["JavaScript", "Java", "PHP", "MySQL"], story: "Building individual web solutions for customers across the automotive, finance and health sectors." },
  { year: "2005 - 2009", start: 2005, end: 2009, role: "Web Engineer", company: "miobambino", desc: "E-commerce for children clothes with individual prints.", stack: ["PHP", "MySQL", "JavaScript", "HTML", "CSS"] },
];
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

/* ---------- A: brass nameplates. Patina grows with age. ---------- */
function renderA() {
  // interpolate plate finish: polished brass (new) -> tarnished bronze/verdigris (old)
  const finishes = [
    ["#e8cf8f", "#a9853f", "#2a2312"], // hi, lo, ink
    ["#dcc182", "#9c7a3c", "#2a2312"],
    ["#c9ad74", "#8a6d38", "#292214"],
    ["#b39a68", "#786037", "#251f13"],
    ["#9c8a63", "#6a5a3b", "#211d13"],
    ["#8a8267", "#5d5a43", "#1e1d14"],
    ["#7c7f6d", "#535a4a", "#1b1e17"], // oldest: hint of verdigris
  ];
  const plates = JOBS.map((j, i) => {
    const [hi, lo, ink] = finishes[i];
    return `
      <div>
        <div class="plate" style="--hi:${hi};--lo:${lo};--ink:${ink}">
          <span class="year">${esc(j.year)}</span>
          <div class="role">${esc(j.role)}</div>
          <div class="co">${esc(j.company)}</div>
        </div>
        <div class="under">
          <p>${esc(j.desc)}</p>
          ${j.story ? `<p class="story">${esc(j.story)}</p>` : ""}
          <div class="tags">${j.stack.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
        </div>
      </div>`;
  }).join("");
  return `<div class="vA">
    <div class="head"><h2>Work History</h2><p>Every door I have had my name on. The shine tells you how long ago.</p></div>
    <div class="wall">${plates}</div>
  </div>`;
}

/* ---------- B: strata. Deeper = older. Band height scales with tenure. ---------- */
function renderB() {
  // earthy sediment palette, top (recent) lighter -> bottom (old) darker
  const soils = [
    ["#8a6f4b", "#f3e8d5"], ["#7c6244", "#efe3cf"], ["#6d573f", "#e9dcc7"],
    ["#5c4a38", "#e2d4bf"], ["#4e3f32", "#d9ccb8"], ["#41352c", "#d1c4b1"],
    ["#352c26", "#c8bcaa"],
  ];
  const seam = (fill) => {
    // jagged sediment boundary
    let d = "M0,14 ";
    for (let x = 0; x <= 100; x += 5) d += `L${x},${14 - (Math.sin(x * 1.7) * 4 + (x % 10 === 0 ? 5 : 0))} `;
    d += "L100,18 L0,18 Z";
    return `<svg class="seam" viewBox="0 0 100 18" preserveAspectRatio="none"><path d="${d}" fill="${fill}"/></svg>`;
  };
  let depth = 0;
  const bands = JOBS.map((j, i) => {
    const yrs = Math.max(1, j.end - j.start);
    const pad = 14 + yrs * 5; // tenure -> band thickness
    depth += yrs;
    const [bg, ink] = soils[i];
    return `
      ${i > 0 ? seam(bg) : ""}
      <section class="band" style="background:${bg};color:${ink};padding-top:${pad}px;padding-bottom:${pad}px">
        <div class="inner">
          <div class="depth">${esc(j.year)}<br/>&darr; ${yrs}y</div>
          <div>
            <div class="role">${esc(j.role)}</div>
            <div class="co">${esc(j.company)}</div>
            <div class="desc">${esc(j.desc)}</div>
            ${j.story ? `<div class="story">${esc(j.story)}</div>` : ""}
            <div class="minerals">${j.stack.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
          </div>
        </div>
      </section>`;
  }).join("");
  // grassy surface line with a tiny ridge silhouette
  const surface = `<svg class="surface" viewBox="0 0 100 20" preserveAspectRatio="none">
    <path d="M0,20 L0,14 L12,10 L22,13 L34,7 L46,12 L58,9 L70,13 L82,8 L92,12 L100,10 L100,20 Z" fill="#22452f"/>
    <path d="M0,20 L0,17 L100,15 L100,20 Z" fill="#2c5738"/>
  </svg>`;
  return `<div class="vB">
    <div class="sky"><h2>Work History</h2><p>Two decades of building, read like a core sample. Dig down: every layer is an era, thickness is tenure.</p></div>
    ${surface}
    <div class="column">${bands}</div>
    <div class="bedrock">Bedrock &middot; 2005 &middot; it starts here</div>
  </div>`;
}

/* ---------- C: the ascent. Valley 2005 -> summit now, cards on waypoints. ---------- */
function renderC() {
  const stops = JOBS.map((j, i) => {
    const side = i % 2 === 0 ? "left" : "right";
    const alt = 2100 - i * 260;
    return `<div class="stop ${side}">
      <div class="card">
        <div class="alt"><span class="flag"></span>${esc(j.year)} &middot; ${alt} m</div>
        <div class="role">${esc(j.role)}</div>
        <div class="co">${esc(j.company)}</div>
        <div class="desc">${esc(j.desc)}</div>
        ${j.story ? `<div class="story">${esc(j.story)}</div>` : ""}
        <div class="gear">${j.stack.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
      </div>
    </div>`;
  }).join("");
  // switchback path behind the cards: zig-zag between card sides, top = now
  const n = JOBS.length;
  let d = `M 50 2`;
  for (let i = 0; i < n; i++) {
    const y = 4 + ((i + 0.5) / n) * 92;
    const x = i % 2 === 0 ? 27 : 73;
    d += ` C 50 ${y - 6}, ${x} ${y - 6}, ${x} ${y} C ${x} ${y + 6}, 50 ${y + 6}, 50 ${y + 10}`;
  }
  const dots = JOBS.map((j, i) => {
    const y = 4 + ((i + 0.5) / n) * 92;
    const x = i % 2 === 0 ? 27 : 73;
    return `<circle cx="${x}" cy="${y}" r="0.9" fill="#e2b04a"/>`;
  }).join("");
  return `<div class="vC">
    <div class="head"><h2>Work History</h2><p>The route so far. Reading up from the valley: twenty years of switchbacks.</p></div>
    <div class="summit"><b>&#9650; You are here</b> &middot; 2026</div>
    <div class="trailwrap">
      <svg class="trail" viewBox="0 0 100 100" preserveAspectRatio="none">
        <path d="${d}" fill="none" stroke="rgba(226,176,74,0.4)" stroke-width="0.45" stroke-dasharray="1.4 1.1"/>
        ${dots}
      </svg>
      <div class="stops">${stops}</div>
    </div>
    <div class="valley">Base camp &middot; 2005</div>
  </div>`;
}

/* ---------- D: personnel dossier. Typed records, ink stamps. ---------- */
function renderD() {
  const recs = JOBS.map((j) => `
    <div class="rec">
      <div class="line1"><span class="role">${esc(j.role)}</span><span class="year">${esc(j.year)}</span></div>
      <div class="co">${esc(j.company)}</div>
      <div class="desc">${esc(j.desc)}</div>
      ${j.story ? `<div class="story">${esc(j.story)}</div>` : ""}
      <div class="inkrow">${j.stack.map((t) => `<span>${esc(t)}</span>`).join("")}</div>
    </div>`).join("");
  return `<div class="vD">
    <div class="folder">
      <span class="tab">Personnel file</span>
      <span class="clip"></span>
      <div class="sheet">
        <span class="stamp">On record</span>
        <div class="sheath">Confidential &middot; ref 2005-&#8734;</div>
        <h2>Work History</h2>
        <div class="subject">Subject: Ortac, Alper &middot; Engineer &middot; 7 engagements on file</div>
        ${recs}
        <div class="eof">&mdash; end of file &mdash;</div>
      </div>
    </div>
  </div>`;
}

const VARIANTS = [
  { key: "a", name: "Brass nameplates", render: renderA },
  { key: "b", name: "Strata (dig)", render: renderB },
  { key: "c", name: "The Ascent", render: renderC },
  { key: "d", name: "Personnel dossier", render: renderD },
];

function current() {
  const k = new URLSearchParams(location.search).get("variant") || "a";
  const i = VARIANTS.findIndex((v) => v.key === k);
  return i === -1 ? 0 : i;
}
function show(i) {
  const v = VARIANTS[(i + VARIANTS.length) % VARIANTS.length];
  const url = new URL(location);
  url.searchParams.set("variant", v.key);
  history.replaceState(null, "", url);
  document.getElementById("stage").innerHTML = v.render();
  document.getElementById("label").innerHTML = `<b>${v.key.toUpperCase()}</b> - ${v.name} <span style="opacity:.5">(${VARIANTS.map(x=>x.key).join("/")})</span>`;
}
document.getElementById("prev").onclick = () => show(current() - 1);
document.getElementById("next").onclick = () => show(current() + 1);
document.addEventListener("keydown", (e) => {
  const t = e.target;
  if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if (e.key === "ArrowLeft") show(current() - 1);
  if (e.key === "ArrowRight") show(current() + 1);
});
show(current());
</script>
