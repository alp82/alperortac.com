<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Subpage perf harness</title>
<!--
  PROTOTYPE - throwaway, not shipped. Performance harness for the subpage
  stack (the early-days / coding page is the worst case: ~5000px of scroll).

  WHY THIS FILE EXISTS. The subpage stack pays costs the main page never pays,
  and docs/audits/scene-frame-budget.md only measured the main page. This file
  replicates the full stack with a kill-switch per suspect and an FPS HUD, so
  each cost is measurable in isolation. Open it, scroll the panel, and flip
  the switches until the frame time drops.

  THE STACK IT REPLICATES:
    - The fixed scene: 8 depth layers, 150 twinkling stars (one compositor
      layer each, per the audit), clouds, mist, fireflies, swaying trees.
      All animations run on the wall clock, as invariant #60 demands.
    - The HELD DIVE: body.dive-active stays on for the whole life of a
      subpage. Every layer holds transform: scale(--layer-scale) and
      filter: blur(--blur) with u=1, blurStrength=5, focalDepth=0.5,
      ZK=4.6, mul=0.85 - the shipped formula from styles.css.
    - The frosted column: backdrop-filter blur(10px) saturate(120%) over
      the animated scene, 1180px wide on the coding page.
    - The coding ladder: 32-year axis, 17 cards at 150px/year, sticky rack
      with LED rows, and the year-flip class churn on scroll.

  HYPOTHESES, one switch each:
    H1 dive-hold  - animations INSIDE scaled+blurred layers re-raster those
                    full-viewport layers every frame. The audit warns exactly
                    this: "blur that changes while the layer moves re-rasters
                    every frame" (7.4fps worst case on software raster).
    H2 frost      - the backdrop-filter re-samples the animated scene every
                    frame, always, even idle.
    H3 anim tax   - ~190 animating elements cost style time per frame
                    (0.066ms each on a mid-range phone) regardless of
                    visibility.
    H4 churn      - year flips restart transitions inside the frosted column
                    almost continuously while scrolling.
    H5 cycles     - open/close cycling accumulates cost (the reported
                    "slower every re-entry"). The cycle button reproduces it
                    and logs per-cycle numbers; if fps degrades cycle over
                    cycle here, the leak is in the stack itself, not React.
    (parallax     - the removed --subpage-scroll drift, kept as a switch to
                    show what it cost. OFF by default, matching src.)

  HOW TO READ THE HUD: frame time avg / p95 over the last 180 frames, and
  the count of dropped frames (>25ms). Use auto-scroll for comparable runs.
-->
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { height: 100%; overflow: hidden; background: #060b18; }
	body { font-family: system-ui, sans-serif; }

	/* ============ the scene: 8 depth layers, held dive ============ */
	.scene {
		position: fixed; inset: 0;
		background: linear-gradient(to bottom, #0b1026 0%, #16224a 55%, #2b3a6b 100%);
	}
	.layer {
		position: absolute; inset: -12px;
		/* Shipped formula: styles.css .dive-layer, u=1 held while a subpage
		   is open. blurStrength=5 (BASE_DIVE_BLUR), focal 0.5, ZK 4.6, mul .85. */
		--z: calc(1 + var(--layer-depth) * 4.6 * var(--dive-u, 0) * 0.85);
		--gain: calc(0.8 * (0.25 + 1.5 * var(--layer-depth)));
		--layer-scale: calc(1 + (var(--z) - 1) * var(--gain));
		--blur: calc(
			var(--blur-strength, 5) *
			max(var(--layer-depth) - 0.5, 0.5 - var(--layer-depth)) *
			var(--dive-u, 0) * 1px
		);
		transform-origin: 50% 50%;
	}
	body.dive-active { --dive-u: 1; }
	body.dive-active .layer {
		transform: scale(var(--layer-scale));
		filter: blur(var(--blur));
	}
	/* The star layer stays crisp, exactly like .dive-layer--crisp in src. */
	body.dive-active .layer[data-crisp] { transform: none; filter: none; }
	/* Kill switches. */
	body.kill-zoom .layer { transform: none !important; }
	body.kill-blur .layer { filter: none !important; }
	body.anim-off .scene * { animation-play-state: paused !important; }

	/* cast */
	.star {
		position: absolute; background: #fff; border-radius: 50%;
		animation: twinkle 3s ease-in-out infinite;
	}
	@keyframes twinkle {
		0%, 100% { opacity: 0.1; transform: scale(0.8); }
		50% { opacity: 1; transform: scale(1.2); }
	}
	.moon {
		position: absolute; top: 12%; right: 18%; width: 64px; height: 64px;
		border-radius: 50%; background: #f3ead0;
		box-shadow: 0 0 42px 8px rgba(243, 234, 208, 0.35);
	}
	.cloud {
		position: absolute; height: 34px; border-radius: 20px;
		background: rgba(200, 214, 240, 0.16);
		animation: cloud-wrap var(--wdur, 100s) linear var(--wdel, 0s) infinite;
	}
	@keyframes cloud-wrap { from { translate: -45vw 0; } to { translate: 110vw 0; } }
	.mist {
		position: absolute; left: -10%; right: -10%; height: 22vh; border-radius: 50%;
		background: radial-gradient(ellipse at 50% 60%, rgba(190, 205, 235, 0.22), transparent 70%);
		animation: mist-sway var(--mdur, 50s) ease-in-out infinite alternate;
	}
	@keyframes mist-sway { from { translate: -20px 0; } to { translate: 20px 0; } }
	.ridge { position: absolute; left: 0; right: 0; bottom: 0; }
	.ridge svg { display: block; width: 100%; height: 100%; }
	.tree {
		position: absolute; bottom: 0; width: 14px; height: 46px;
		background: #0a1220;
		clip-path: polygon(50% 0, 100% 100%, 0 100%);
		transform-origin: 50% 100%;
		animation: tree-sway var(--tdur, 6s) ease-in-out var(--tdel, 0s) infinite alternate;
	}
	@keyframes tree-sway { from { rotate: -2.7deg; } to { rotate: 2.7deg; } }
	.ff {
		position: absolute; width: 4px; height: 4px; border-radius: 50%;
		background: #ffe9a3; box-shadow: 0 0 8px 2px rgba(255, 233, 163, 0.6);
		animation: ff-flash var(--fdur, 4s) linear var(--fdel, 0s) infinite;
	}
	@keyframes ff-flash {
		0%, 57.9% { opacity: 0.12; }
		58%, 72% { opacity: 1; }
		72.1%, 100% { opacity: 0.12; }
	}

	/* ============ the panel surface + frosted column ============ */
	.surface {
		position: fixed; inset: 0; overflow-y: auto; overflow-x: hidden;
		overscroll-behavior: contain; z-index: 60;
	}
	body.panel-closed .surface { display: none; }
	.column {
		max-width: 1180px; margin: 8vh auto; color: #f8fafc;
		background: rgba(15, 23, 42, 0.7);
		backdrop-filter: blur(var(--frost, 10px)) saturate(120%);
		-webkit-backdrop-filter: blur(var(--frost, 10px)) saturate(120%);
	}
	body.frost-off .column { backdrop-filter: none; -webkit-backdrop-filter: none; }
	body.col-768 .column { max-width: 768px; }
	body.col-full .column { max-width: none; margin: 0; }
	.inner { padding: 3.5rem 2.5rem 4.5rem; }
	.head { margin-bottom: 2.75rem; }
	.kicker {
		font-family: monospace; font-size: 15px; letter-spacing: 0.28em;
		text-transform: uppercase; color: #fbbf24;
	}
	.title { font-weight: 900; text-transform: uppercase; line-height: 0.9; font-size: 54px; }
	.shell { display: grid; gap: 40px; align-items: start; grid-template-columns: minmax(0, 1fr) 236px; }
	.field { position: relative; }
	.axis {
		position: absolute; left: 0; top: 0; bottom: 0; width: 78px;
		border-right: 1px solid rgba(148, 180, 220, 0.2);
	}
	.yr {
		position: absolute; right: 0; height: 0; width: 100%;
		display: flex; align-items: center; justify-content: flex-end; gap: 8px;
		transition: opacity 200ms ease;
	}
	.yr-lbl {
		font-family: monospace; font-size: 14px; color: #56697f;
		transition: color 200ms ease;
	}
	.yr-tk {
		display: block; height: 1px; width: 8px;
		background: rgba(148, 180, 220, 0.28);
		transition: background 200ms ease;
	}
	.yr.ahead { opacity: 0.55; }
	.yr.now .yr-lbl { color: #fbbf24; font-size: 18px; }
	.yr.now .yr-tk { width: 24px; height: 2px; background: #fbbf24; }
	/* The churn switch restores the SHIPPED layout-animating transitions, to
	   measure what they cost (font-size / width animate = re-layout per frame). */
	body.churn-layout .yr-lbl { transition: color 200ms ease, font-size 160ms ease; }
	body.churn-layout .yr-tk { transition: background 200ms ease, width 200ms ease; }
	.lane { position: absolute; top: 0; left: 108px; right: 0; list-style: none; }
	.card {
		position: absolute; left: 0; right: 0; max-width: 620px;
		padding-left: 18px; border-left: 3px solid rgba(251, 191, 36, 0.16);
		transition: border-color 260ms ease;
	}
	.card.active { border-left-color: #fbbf24; }
	.cap { font-family: monospace; font-size: 17px; color: #fbbf24; margin-bottom: 9px; }
	.beat { font-size: 15.5px; line-height: 1.7; margin-bottom: 10px; color: #e2e8f0; }
	.tag {
		font-family: monospace; font-size: 12px; padding: 0 7px;
		border: 1px solid rgba(251, 191, 36, 0.42); color: #fde68a;
		display: inline-block; margin-right: 5px;
	}
	.rack {
		border: 3px solid rgba(255, 255, 255, 0.16); background: rgba(8, 14, 26, 0.72);
		padding: 12px; position: sticky; top: 76px; max-height: calc(100vh - 96px);
		overflow-y: auto; font-family: monospace;
	}
	.rack h4 {
		font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
		color: #475569; margin: 7px 0 2px; font-weight: 400;
	}
	.unit {
		display: grid; grid-template-columns: 9px minmax(0, 1fr) auto;
		align-items: center; gap: 7px; height: 18px; font-size: 13px;
		color: #5b6d84; transition: color 240ms ease, opacity 240ms ease;
	}
	.unit .led {
		width: 7px; height: 7px; background: #1e293b;
		transition: background 240ms ease, box-shadow 240ms ease;
	}
	.unit.live { color: #fde68a; }
	.unit.live .led { background: #fbbf24; box-shadow: 0 0 7px 1px rgba(251, 191, 36, 0.75); }

	/* ============ HUD + controls ============ */
	.hud {
		position: fixed; top: 10px; left: 10px; z-index: 100;
		background: rgba(0, 0, 0, 0.82); color: #d7e3f7;
		font: 12px/1.5 monospace; padding: 8px 10px; border: 1px solid #2b3a5c;
		min-width: 240px; pointer-events: none;
	}
	.hud b { color: #fbbf24; font-weight: 400; }
	.hud .bad { color: #f87171; }
	.hud canvas { display: block; margin-top: 4px; background: #0a0f1e; }
	.bar {
		position: fixed; left: 10px; bottom: 10px; z-index: 100;
		background: rgba(0, 0, 0, 0.85); color: #d7e3f7;
		font: 12px/1.9 monospace; padding: 8px 12px; border: 1px solid #2b3a5c;
		max-width: 330px;
	}
	.bar label { display: block; cursor: pointer; user-select: none; }
	.bar input[type="range"] { width: 90px; vertical-align: middle; }
	.bar button {
		font: 12px monospace; background: #1a2440; color: #ffd97a;
		border: 1px solid #3a4a75; padding: 2px 9px; margin: 4px 6px 0 0; cursor: pointer;
	}
	.bar .log { margin-top: 6px; max-height: 130px; overflow-y: auto; color: #9fb4cd; }
	.bar .log .worse { color: #f87171; }
</style>
</head>
<body class="dive-active">

<div class="scene" id="scene"></div>

<div class="surface" id="surface">
	<div class="column" id="column">
		<div class="inner">
			<header class="head">
				<p class="kicker">Coding</p>
				<h2 class="title">Everything<br />I have run</h2>
			</header>
			<div class="shell">
				<div class="field" id="field">
					<div class="axis" id="axis"></div>
					<ol class="lane" id="lane"></ol>
				</div>
				<aside class="rack" id="rack"></aside>
			</div>
		</div>
	</div>
</div>

<div class="hud">
	<div id="hudText">warming up…</div>
	<canvas id="spark" width="240" height="36"></canvas>
</div>

<div class="bar">
	<label><input type="checkbox" id="tDive" checked /> H1 dive hold (scale+blur on layers)</label>
	<label style="padding-left:18px"><input type="checkbox" id="tBlur" checked /> &nbsp;· layer blur only</label>
	<label style="padding-left:18px"><input type="checkbox" id="tZoom" checked /> &nbsp;· layer zoom only</label>
	<label><input type="checkbox" id="tFrost" checked /> H2 frost <input type="range" id="rFrost" min="0" max="16" value="10" /> <span id="vFrost">10px</span></label>
	<label><input type="checkbox" id="tAnim" checked /> H3 scene animations run</label>
	<label>&nbsp;&nbsp;stars <input type="range" id="rStars" min="0" max="450" step="50" value="150" /> <span id="vStars">150</span></label>
	<label><input type="checkbox" id="tChurn" checked /> H4 year churn (shipped layout transitions)</label>
	<label><input type="checkbox" id="tPara" /> parallax drift (removed from src)</label>
	<label>column <select id="sCol"><option value="">1180px</option><option value="col-768">768px</option><option value="col-full">full-bleed</option></select></label>
	<div>
		<button id="bScroll">auto-scroll run</button>
		<button id="bCycle">H5 open/close ×10</button>
	</div>
	<div class="log" id="log"></div>
</div>

<script>
"use strict";

/* ---------------- deterministic PRNG so runs are comparable -------------- */
function prng(seed) {
	let s = seed >>> 0;
	return () => {
		s = (s * 1664525 + 1013904223) >>> 0;
		return s / 4294967296;
	};
}

/* ---------------- the scene ---------------- */
const scene = document.getElementById("scene");
const DEPTHS = [0.05, 0.12, 0.2, 0.35, 0.5, 0.65, 0.8, 0.93];
const layers = DEPTHS.map((d, i) => {
	const el = document.createElement("div");
	el.className = "layer";
	el.style.setProperty("--layer-depth", d);
	if (i === 0) el.dataset.crisp = ""; /* star layer stays crisp, like src */
	scene.appendChild(el);
	return el;
});

function ridgeSvg(color, h, seed) {
	const r = prng(seed);
	let pts = "0,100 ";
	for (let x = 0; x <= 100; x += 5) pts += `${x},${(30 + r() * 40).toFixed(1)} `;
	pts += "100,100";
	return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="height:${h}"><polygon points="${pts}" fill="${color}"/></svg>`;
}

function buildStars(count) {
	const host = layers[0];
	host.innerHTML = '<div class="moon"></div>';
	const r = prng(42);
	for (let i = 0; i < count; i++) {
		const s = document.createElement("div");
		s.className = "star";
		const size = 1 + r() * 2.4;
		s.style.cssText = `left:${(r() * 100).toFixed(2)}%;top:${(r() * 70).toFixed(2)}%;width:${size.toFixed(1)}px;height:${size.toFixed(1)}px;animation-delay:${(r() * 5).toFixed(2)}s;animation-duration:${(2 + r() * 3).toFixed(2)}s;box-shadow:0 0 ${(size * 2).toFixed(1)}px rgba(255,255,255,.6)`;
		host.appendChild(s);
	}
}
buildStars(150);

{
	const r = prng(7);
	for (let i = 0; i < 6; i++) {
		const c = document.createElement("div");
		c.className = "cloud";
		c.style.cssText = `top:${(8 + r() * 30).toFixed(1)}%;width:${(120 + r() * 180) | 0}px;--wdur:${(80 + r() * 60) | 0}s;--wdel:${(-r() * 80) | 0}s`;
		layers[2].appendChild(c);
	}
	const mistFar = document.createElement("div");
	mistFar.className = "mist";
	mistFar.style.cssText = "bottom:26vh;--mdur:47s";
	layers[3].appendChild(mistFar);
	const mistNear = document.createElement("div");
	mistNear.className = "mist";
	mistNear.style.cssText = "bottom:8vh;--mdur:61s";
	layers[6].appendChild(mistNear);

	const mk = (layer, color, h, seed) => {
		const div = document.createElement("div");
		div.className = "ridge";
		div.style.height = h;
		div.innerHTML = ridgeSvg(color, "100%", seed);
		layer.appendChild(div);
		return div;
	};
	mk(layers[4], "#131c33", "34vh", 1);
	const mid = mk(layers[5], "#0d1527", "27vh", 2);
	mk(layers[7], "#070d1b", "18vh", 3);
	for (let i = 0; i < 40; i++) {
		const t = document.createElement("div");
		t.className = "tree";
		t.style.cssText = `left:${(r() * 100).toFixed(1)}%;height:${(30 + r() * 34) | 0}px;--tdur:${(5 + r() * 3).toFixed(1)}s;--tdel:${(-r() * 6).toFixed(1)}s`;
		mid.appendChild(t);
	}
	for (let i = 0; i < 24; i++) {
		const f = document.createElement("div");
		f.className = "ff";
		f.style.cssText = `left:${(r() * 100).toFixed(1)}%;bottom:${(2 + r() * 16).toFixed(1)}vh;--fdur:${(3 + r() * 4).toFixed(1)}s;--fdel:${(-r() * 5).toFixed(1)}s`;
		layers[7].appendChild(f);
	}
}

/* ---------------- the ladder ---------------- */
const Y0 = 1995, Y1 = 2026, PPY = 150;
const STOP_YEARS = [1995, 1998, 2000, 2002, 2004, 2005, 2007, 2009, 2011, 2013, 2015, 2017, 2019, 2021, 2022, 2024, 2026];
const surface = document.getElementById("surface");
const field = document.getElementById("field");
const axis = document.getElementById("axis");
const lane = document.getElementById("lane");
const rack = document.getElementById("rack");

const yrEls = [];
for (let y = Y0; y <= Y1; y++) {
	const row = document.createElement("div");
	row.className = "yr" + (y > Y0 ? " ahead" : " now");
	row.style.top = `${(y - Y0) * PPY}px`;
	row.innerHTML = `<span class="yr-lbl">${y}</span><span class="yr-tk"></span>`;
	axis.appendChild(row);
	yrEls.push(row);
}
const BEAT = "A believable amount of prose for one card, roughly what a real stop carries: two or three sentences about what got built that year, what it ran on, and why it mattered at the time.";
const cardEls = STOP_YEARS.map((y, i) => {
	const li = document.createElement("li");
	li.className = "card" + (i === 0 ? " active" : "");
	li.style.top = `${(y - Y0) * PPY}px`;
	li.innerHTML = `<div class="cap">${y} · stop ${i + 1} of ${STOP_YEARS.length}</div><p class="beat">${BEAT}</p><p class="beat">${BEAT.slice(0, 120)}</p><span class="tag">racked something</span><span class="tag">racked more</span>`;
	lane.appendChild(li);
	return li;
});
field.style.height = `${(Y1 - Y0) * PPY + 700}px`;

const GROUPS = ["language", "markup", "framework", "data", "infra", "elsewhere"];
const unitEls = [];
GROUPS.forEach((g, gi) => {
	const h = document.createElement("h4");
	h.textContent = g;
	rack.appendChild(h);
	for (let u = 0; u < 6; u++) {
		const row = document.createElement("div");
		row.className = "unit";
		row.innerHTML = `<span class="led"></span><span>unit-${gi}-${u}</span><span>'0${u}-</span>`;
		rack.appendChild(row);
		/* Each unit comes alive at a fixed year so year flips toggle a few rows. */
		unitEls.push({ el: row, from: Y0 + gi * 5 + u });
	}
});

/* Year churn: exactly what the React panel does on a flip - class swaps that
   start CSS transitions inside the frosted column. */
let year = Y0;
function applyYear(y) {
	if (y === year) return;
	year = y;
	yrEls.forEach((el, i) => {
		const yy = Y0 + i;
		el.className = "yr" + (yy === y ? " now" : yy < y ? " past" : " ahead");
	});
	const ai = STOP_YEARS.reduce((acc, sy, i) => (sy <= y ? i : acc), 0);
	cardEls.forEach((el, i) => el.classList.toggle("active", i === ai));
	for (const u of unitEls) u.el.classList.toggle("live", u.from <= y);
}

let queued = false;
surface.addEventListener("scroll", () => {
	if (queued) return;
	queued = true;
	requestAnimationFrame(() => {
		queued = false;
		const st = surface.scrollTop;
		if (document.getElementById("tChurn").checked) {
			applyYear(Math.min(Y1, Y0 + Math.max(0, Math.floor((st - 100) / PPY + 1))));
		}
		if (document.getElementById("tPara").checked) {
			scene.style.translate = `0 ${(st * -0.02).toFixed(1)}px`;
		}
	});
}, { passive: true });

/* ---------------- HUD: rAF frame-time probe ---------------- */
const hudText = document.getElementById("hudText");
const spark = document.getElementById("spark").getContext("2d");
const ring = new Float32Array(180);
let ri = 0, filled = 0, last = performance.now(), hudLast = 0;
function probe(now) {
	const dt = now - last;
	last = now;
	ring[ri] = dt;
	ri = (ri + 1) % ring.length;
	if (filled < ring.length) filled++;
	if (now - hudLast > 250) {
		hudLast = now;
		const arr = Array.from(ring.subarray(0, filled)).sort((a, b) => a - b);
		const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
		const p95 = arr[Math.floor(arr.length * 0.95)] || 0;
		const dropped = arr.filter((d) => d > 25).length;
		const mem = performance.memory ? ` · heap ${(performance.memory.usedJSHeapSize / 1048576).toFixed(0)}MB` : "";
		hudText.innerHTML =
			`<b>${(1000 / mean).toFixed(1)} fps</b> · avg ${mean.toFixed(1)}ms · p95 ${p95.toFixed(1)}ms` +
			` · <span class="${dropped > 5 ? "bad" : ""}">${dropped} dropped</span>` +
			`<br/>nodes ${document.querySelectorAll("*").length}${mem}`;
		spark.fillStyle = "#0a0f1e";
		spark.fillRect(0, 0, 240, 36);
		spark.fillStyle = "#fbbf24";
		for (let i = 0; i < filled; i++) {
			const d = ring[(ri + i) % ring.length];
			const h = Math.min(36, (d / 50) * 36);
			if (d > 25) spark.fillStyle = "#f87171"; else spark.fillStyle = "#fbbf24";
			spark.fillRect(i * (240 / ring.length), 36 - h, 240 / ring.length, h);
		}
		spark.fillStyle = "#334662";
		spark.fillRect(0, 36 - (16.7 / 50) * 36, 240, 1);
	}
	requestAnimationFrame(probe);
}
requestAnimationFrame(probe);

function windowStats(msWindow) {
	/* mean fps over the last msWindow of samples in the ring */
	const arr = [];
	let acc = 0;
	for (let i = 0; i < filled; i++) {
		const d = ring[(ri - 1 - i + ring.length * 2) % ring.length];
		arr.push(d);
		acc += d;
		if (acc >= msWindow) break;
	}
	const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
	return { fps: 1000 / mean, p95: arr.sort((a, b) => a - b)[Math.floor(arr.length * 0.95)] || 0 };
}

/* ---------------- controls ---------------- */
const logEl = document.getElementById("log");
function log(msg, worse) {
	const div = document.createElement("div");
	div.textContent = msg;
	if (worse) div.className = "worse";
	logEl.prepend(div);
}
function bindClass(id, cls, invert) {
	document.getElementById(id).addEventListener("change", (e) => {
		document.body.classList.toggle(cls, invert ? !e.target.checked : e.target.checked);
	});
}
bindClass("tDive", "dive-active");
bindClass("tBlur", "kill-blur", true);
bindClass("tZoom", "kill-zoom", true);
bindClass("tFrost", "frost-off", true);
bindClass("tAnim", "anim-off", true);
bindClass("tChurn", "churn-layout");
document.getElementById("tChurn").dispatchEvent(new Event("change"));
document.getElementById("tPara").addEventListener("change", (e) => {
	if (!e.target.checked) scene.style.translate = "";
});
document.getElementById("rFrost").addEventListener("input", (e) => {
	document.body.style.setProperty("--frost", `${e.target.value}px`);
	document.getElementById("vFrost").textContent = `${e.target.value}px`;
});
document.getElementById("rStars").addEventListener("input", (e) => {
	buildStars(+e.target.value);
	document.getElementById("vStars").textContent = e.target.value;
});
document.getElementById("sCol").addEventListener("change", (e) => {
	document.body.classList.remove("col-768", "col-full");
	if (e.target.value) document.body.classList.add(e.target.value);
});

/* auto-scroll: 1200px/s down then up, mirroring the audit's method */
let scrolling = false;
document.getElementById("bScroll").addEventListener("click", async () => {
	if (scrolling) return;
	scrolling = true;
	const max = surface.scrollHeight - surface.clientHeight;
	const t0 = performance.now();
	await new Promise((done) => {
		function step(now) {
			const t = (now - t0) / 1000;
			const dist = t * 1200;
			surface.scrollTop = dist <= max ? dist : Math.max(0, 2 * max - dist);
			if (dist < 2 * max) requestAnimationFrame(step); else done();
		}
		requestAnimationFrame(step);
	});
	const s = windowStats(3000);
	log(`scroll run: ${s.fps.toFixed(1)} fps · p95 ${s.p95.toFixed(1)}ms`, s.fps < 50);
	scrolling = false;
});

/* H5: open/close cycling. Each cycle closes the panel + drops the dive (as
   close does in src, after the 760ms exit), reopens, then measures. If fps
   sinks cycle over cycle, the accumulation lives in this stack. */
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
document.getElementById("bCycle").addEventListener("click", async () => {
	for (let i = 1; i <= 10; i++) {
		document.body.classList.add("panel-closed");
		document.body.classList.remove("dive-active");
		await wait(800);
		document.body.classList.remove("panel-closed");
		document.body.classList.add("dive-active");
		await wait(800);
		surface.scrollTop = 0;
		const t0 = performance.now();
		await new Promise((done) => {
			function step(now) {
				const t = (now - t0) / 1000;
				surface.scrollTop = t * 1200;
				if (t < 1.5) requestAnimationFrame(step); else done();
			}
			requestAnimationFrame(step);
		});
		const s = windowStats(1500);
		log(`cycle ${i}: ${s.fps.toFixed(1)} fps · p95 ${s.p95.toFixed(1)}ms · nodes ${document.querySelectorAll("*").length}`, s.fps < 50);
	}
});
</script>
